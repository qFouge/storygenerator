# ATTENTION : les faits ci-dessous sont un point de départ rédigé de mémoire.
# Chaque entrée porte `source` et `verifie`. Tant que `verifie: false`, le fait
# n'est PAS considéré comme validé — le pipeline refuse de générer dessus
# (cf. pipeline/place.go). Vérifier sur chambord.org / une source primaire,
# corriger si besoin, puis passer `verifie: true`.

id: chambord
nom: Château de Chambord
region: Loir-et-Cher, Centre-Val de Loire
resume: >
  Le plus vaste des châteaux de la Loire, lancé par François Ier en 1519 au
  milieu d'une forêt marécageuse, pour un roi qui n'y a presque jamais dormi.

faits:
  - id: escalier-double-revolution
    titre: L'escalier à double révolution
    recit: >
      Au cœur du donjon, un escalier composé de deux hélices entrelacées
      montant autour d'un noyau creux. Deux personnes qui l'empruntent
      chacune par une volée se voient par les ouvertures du noyau mais ne
      se croisent jamais. L'attribution du dessin à Léonard de Vinci est
      débattue : il vivait au Clos Lucé à l'invitation de François Ier
      depuis 1516 et est mort le 2 mai 1519, l'année même du début du
      chantier, mais aucun document ne prouve sa participation.
    personnages: [François Ier, Léonard de Vinci]
    epoque: 1519
    source: "à compléter"
    verifie: false
    angles:
      - Le mystère de l'attribution à Léonard de Vinci
      - "Le jeu de cache-cache : se voir sans jamais se croiser"

  - id: roi-absent
    titre: Le palais où le roi n'a pas habité
    recit: >
      François Ier a lancé un chantier colossal qu'il n'a occupé que
      quelques semaines au total sur la fin de son règne. Chambord n'était
      pas une résidence mais une démonstration de puissance, un pavillon
      de chasse démesuré planté dans une zone marécageuse difficile
      d'accès et impossible à chauffer.
    personnages: [François Ier]
    epoque: 1519-1547
    source: "à compléter"
    verifie: false
    angles:
      - Construire un palais géant pour ne pas y vivre
      - "Le froid, les marais, les moustiques : la vie quotidienne du chantier"

  - id: moliere-pourceaugnac
    titre: Molière crée une pièce dans le château
    recit: >
      Sous Louis XIV, Chambord sert de cadre à des séjours de cour.
      Molière y crée "Monsieur de Pourceaugnac" en 1669, puis
      "Le Bourgeois gentilhomme" en 1670, avec des musiques de Lully.
    personnages: [Molière, Louis XIV, Lully]
    epoque: 1669-1670
    source: "à compléter"
    verifie: false
    angles:
      - Un théâtre monté dans un château glacial
      - "Faire rire un roi : le risque du métier"
