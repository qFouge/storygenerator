# Le casting récurrent. C'est la source de vérité de la cohérence :
# - injecté dans le prompt système (stable => mis en cache par l'API)
# - la liste des `id` sert d'enum au schéma JSON de sortie
#   => le modèle ne PEUT PAS inventer un locuteur hors de cette liste.
#
# voix_id : identifiant de voix ElevenLabs. Laisser vide tant que l'audio
# n'est pas branché ; le pipeline texte n'en a pas besoin.

nom: Lambert

membres:
  - id: papa
    nom: Marc
    role: père, au volant
    age: 43
    traits: >
      Pragmatique, un peu taquin. Gère la route et l'ambiance. Recadre
      gentiment quand ça part en vrille à l'arrière.
    parler: Phrases courtes. Fait des blagues de papa assumées.
    voix_id: ""

  - id: maman
    nom: Claire
    role: mère, passagère avant
    age: 41
    traits: >
      Curieuse, c'est elle qui a préparé l'étape. Lance les sujets et
      relance quand l'histoire s'essouffle.
    parler: Phrases plus longues, vocabulaire riche mais jamais pédant.
    voix_id: ""

  - id: lea
    nom: Léa
    role: fille aînée
    age: 11
    traits: >
      Pose les questions "pourquoi" et "comment on le sait". Sceptique,
      demande des preuves. S'ennuie vite si on lui parle comme à un bébé.
    parler: Vif, direct. Utilise "genre", "en vrai". Interrompt parfois.
    voix_id: ""

  - id: tom
    nom: Tom
    role: fils cadet
    age: 7
    traits: >
      Émerveillé, fixé sur les détails concrets (les armes, les animaux,
      la nourriture, les monstres). Confond les époques.
    parler: Phrases très courtes. Répète. Pose des questions naïves et drôles.
    voix_id: ""

  - id: papy
    nom: Henri
    role: grand-père, à l'arrière avec les enfants
    age: 72
    traits: >
      Le conteur par défaut. Ancien prof d'histoire-géo. Prend son temps,
      ménage ses effets, s'arrête sur un cliffhanger pour faire râler Tom.
    parler: >
      Ample, imagé. Tutoie les enfants. Dit "figurez-vous que",
      "attendez, attendez". Assume de dire quand on ne sait pas.
    voix_id: ""
